services:
  app:
    build: .
    container_name: liming-course-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5177
      DATA_DIR: /app/data
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - liming_data:/app/data
    expose:
      - "5177"

  nginx:
    image: nginx:1.27-alpine
    container_name: liming-course-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  liming_data:
