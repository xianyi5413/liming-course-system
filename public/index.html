<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黎明教育课程管理系统</title>
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("liming:theme") || "system";
        } catch {
          document.documentElement.dataset.theme = "system";
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div>
            <div class="brand-name">黎明教育</div>
            <div class="brand-subtitle">课程管理</div>
          </div>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main class="main">
        <header id="topbar" class="topbar" data-month-toolbar="true"></header>
        <section id="content" class="content">
          <div class="loading">加载中...</div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
